[project]
name = "agritwin"
version = "0.1.0"
description = "AgriTwin: a purpose-built, extensible MCP server + LangGraph agent that drafts officer-gated, fully-cited climate-smart advisories from a farm's digital twin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.10,<2",  # langchain-mcp-adapters 0.3.x targets the 1.x SDK (FastMCP)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.3",
  "langchain-anthropic>=0.3",
  "chuk-mcp-open-meteo>=0.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
agritwin-mcp = "agritwin.mcp_server.server:main"
agritwin-api = "agritwin.api.app:main"
agritwin-agent = "agritwin.agent.run:main"
agritwin-evals = "evals.run_evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agritwin", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
